[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litagent"
version = "0.1.0"
description = "多模态文献研读 Agent（面向 AI 求职的作品集项目）"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.24.0",
    "chromadb>=0.5.0",
    "langchain-text-splitters>=0.3.0",
    "rank-bm25>=0.2.2",
    "fastapi>=0.100.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
]

[tool.setuptools]
packages = [
    "config",
    "litagent",
    "litagent.ingest",
    "litagent.rag",
    "litagent.agent",
    "litagent.eval",
    "litagent.ui",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # 行长限制交给编辑习惯，不强制
    # 保留对「索引后再判断」等少数合理模式的宽容
    "B024",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"